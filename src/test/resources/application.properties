# Test-only keys; never loaded from the production classpath.
app.jwt.secret=test-only-jwt-key-at-least-32-bytes-long
app.auth.code-secret=test-only-email-hmac-key-at-least-32-bytes
app.auth.secure-cookie=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
