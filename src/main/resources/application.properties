spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Production secrets are required; there is no fallback signing key.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=fat-backend
app.jwt.access-seconds=3600
app.auth.code-secret=${EMAIL_CODE_SECRET:}
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
app.mail.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.avatar.storage-path=${AVATAR_STORAGE_PATH:/workspace/shared/fat-avatars}
