services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fat_dev
      MYSQL_USER: fat_dev
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fat_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  fat_mysql_dev:
